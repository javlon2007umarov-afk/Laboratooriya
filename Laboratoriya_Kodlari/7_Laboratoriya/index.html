<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elektron kundalik</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 15px; }
        h2, h3 { color: #222; }
        .form-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        input, button { padding: 8px 12px; font-size: 14px; }
        input[type="text"] { flex: 1; min-width: 180px; }
        button { cursor: pointer; background: #1a73e8; color: #fff; border: none; border-radius: 4px; }
        button:hover { background: #1557b0; }
        .del-btn { background: #d93025; padding: 4px 8px; font-size: 12px; }
        .del-btn:hover { background: #a50e0e; }
        .error { color: #d93025; margin-bottom: 15px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; margin-bottom: 25px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background: #f4f4f4; }
    </style>
</head>
<body>
    <h2>Elektron kundalik</h2>
    <div class="form-group">
        <input type="text" id="fan" placeholder="Fan nomi (masalan: Matematika)">
        <input type="number" id="baho" placeholder="Baho (2-5)" min="2" max="5">
        <button onclick="qoshish()">Qo'shish</button>
    </div>
    <div id="xato" class="error"></div>

    <h3>Baholar ro'yxati</h3>
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Fan</th>
                <th>Baho</th>
                <th>Amal</th>
            </tr>
        </thead>
        <tbody id="royxat-tanasi"></tbody>
    </table>

    <h3>Fanlar bo'yicha o'rtacha baho</h3>
    <table>
        <thead>
            <tr>
                <th>Fan</th>
                <th>O'rtacha baho</th>
            </tr>
        </thead>
        <tbody id="ortacha-tanasi"></tbody>
    </table>

    <script>
        const KALIT = "elektron_kundalik_baholar";
        let baholar = [];

        function tekshir(fan, baho) {
            if (!fan.trim()) return "Fan nomini kiriting.";
            if (!Number.isInteger(baho) || baho < 2 || baho > 5)
                return "Baho 2 dan 5 gacha butun son bo'lishi kerak.";
            return "";
        }

        function ortachalar(royxat) {
            const guruh = {};
            royxat.forEach(b => { (guruh[b.fan] = guruh[b.fan] || []).push(b.baho); });
            return Object.entries(guruh).map(([fan, arr]) =>
                ({ fan, ortacha: (arr.reduce((a, b) => a + b, 0) / arr.length).toFixed(2) }));
        }

        function saqla() {
            localStorage.setItem(KALIT, JSON.stringify(baholar));
        }

        function yukla() {
            baholar = JSON.parse(localStorage.getItem(KALIT)) || [];
        }

        function qoshish() {
            const fanInput = document.getElementById("fan");
            const bahoInput = document.getElementById("baho");
            const xatoDiv = document.getElementById("xato");

            const fan = fanInput.value;
            const baho = Number(bahoInput.value);

            const xatoMatn = tekshir(fan, baho);
            if (xatoMatn) {
                xatoDiv.textContent = xatoMatn;
                return;
            }

            xatoDiv.textContent = "";
            baholar.push({ fan: fan.trim(), baho: baho });
            saqla();
            chiz();

            fanInput.value = "";
            bahoInput.value = "";
        }

        function ochirish(indeks) {
            baholar.splice(indeks, 1);
            saqla();
            chiz();
        }

        function chiz() {
            const tbody = document.getElementById("royxat-tanasi");
            tbody.innerHTML = "";

            if (baholar.length === 0) {
                const tr = document.createElement("tr");
                const td = document.createElement("td");
                td.colSpan = 4;
                td.textContent = "Hozircha baho kiritilmagan";
                tr.appendChild(td);
                tbody.appendChild(tr);
            } else {
                baholar.forEach((item, index) => {
                    const tr = document.createElement("tr");

                    const tdNum = document.createElement("td");
                    tdNum.textContent = index + 1;

                    const tdFan = document.createElement("td");
                    tdFan.textContent = item.fan;

                    const tdBaho = document.createElement("td");
                    tdBaho.textContent = item.baho;

                    const tdAmal = document.createElement("td");
                    const btn = document.createElement("button");
                    btn.textContent = "O'chirish";
                    btn.className = "del-btn";
                    btn.onclick = () => ochirish(index);
                    tdAmal.appendChild(btn);

                    tr.appendChild(tdNum);
                    tr.appendChild(tdFan);
                    tr.appendChild(tdBaho);
                    tr.appendChild(tdAmal);
                    tbody.appendChild(tr);
                });
            }

            const ortachaTbody = document.getElementById("ortacha-tanasi");
            ortachaTbody.innerHTML = "";
            const natijalar = ortachalar(baholar);

            if (natijalar.length === 0) {
                const tr = document.createElement("tr");
                const td = document.createElement("td");
                td.colSpan = 2;
                td.textContent = "Ma'lumot yo'q";
                tr.appendChild(td);
                ortachaTbody.appendChild(tr);
            } else {
                natijalar.forEach(item => {
                    const tr = document.createElement("tr");
                    const tdFan = document.createElement("td");
                    tdFan.textContent = item.fan;
                    const tdOrt = document.createElement("td");
                    tdOrt.textContent = item.ortacha;
                    tr.appendChild(tdFan);
                    tr.appendChild(tdOrt);
                    ortachaTbody.appendChild(tr);
                });
            }
        }

        yukla();
        chiz();
    </script>
</body>
</html>
